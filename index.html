<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vuelos Americanos GPS</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Type: Fraunces (title), Inter (UI), IBM Plex Mono (year labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1D1810">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vuelos GPS">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --ink: #14110F;
      --panel: #1D1810;
      --panel-line: rgba(184, 134, 59, 0.28);
      --parchment: #EFE4C9;
      --brass: #B8863B;
      --brass-bright: #D9A857;
      --stone: #8C8272;
      --amber: #C9962B;
      --amber-bright: #E8B84B;
    }

    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: var(--ink);
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--parchment);
    }

    .leaflet-control-zoom { display: none !important; }

    .leaflet-control-attribution {
      background: rgba(20, 17, 15, 0.75) !important;
      color: var(--stone) !important;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px !important;
      border: 1px solid var(--panel-line);
    }
    .leaflet-control-attribution a { color: var(--brass) !important; }

    .title-line {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: 12.5px;
      color: var(--stone);
      letter-spacing: 0.01em;
      margin: 0 0 5px 2px;
    }

    /* --- Slim tab bar --- */
    .tabbar {
      background: linear-gradient(180deg, rgba(29,24,16,0.96), rgba(20,17,15,0.94));
      border: 1px solid var(--panel-line);
      border-radius: 3px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      padding: 5px;
    }

    .tab {
      font-family: 'Inter', sans-serif;
      background: transparent;
      border: 1px solid var(--panel-line);
      color: var(--parchment);
      border-radius: 2px;
      padding: 5px 10px;
      display: flex;
      align-items: baseline;
      gap: 5px;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab:hover { border-color: var(--brass); }
    .tab .tab-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tab .tab-years {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--parchment);
    }
    .tab.is-active {
      background: var(--brass);
      border-color: var(--brass-bright);
    }
    .tab.is-active .tab-label { color: var(--ink); }
    .tab.is-active .tab-years { color: var(--ink); }

    /* --- Overlay toggle row: Catastro + Nombres. Its own row below the
       base-layer tabs, in a distinct amber shade so it visually reads as
       "additive layer(s)" rather than another exclusive tab --- */
    .overlay-row {
      margin-top: 5px;
    }
    .overlay-toggle {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, rgba(29,24,16,0.96), rgba(20,17,15,0.94));
      border: 1px solid rgba(201, 150, 43, 0.5);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      color: var(--amber-bright);
      border-radius: 3px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      white-space: nowrap;
      cursor: pointer;
      width: fit-content;
    }
    .overlay-toggle:hover { border-color: var(--amber-bright); }
    .overlay-toggle .toggle-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .overlay-toggle .toggle-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid var(--amber-bright);
      background: transparent;
      transition: background-color 150ms ease, border-color 150ms ease;
      flex-shrink: 0;
    }
    .overlay-toggle.is-on {
      border-color: var(--amber-bright);
      background: var(--amber);
      color: var(--ink);
    }
    .overlay-toggle.is-on .toggle-label { color: var(--ink); }
    .overlay-toggle.is-on .toggle-dot {
      background: var(--ink);
      border-color: var(--ink);
    }

    /* --- Instrument-style recenter dial --- */
    .dial-btn {
      background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 70%);
      border: 1px solid rgba(0,0,0,0.35);
      box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 0 0 3px rgba(20,17,15,0.18);
      color: var(--ink);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .dial-btn:active { transform: scale(0.94); }
    .dial-btn.is-idle {
      background: var(--panel);
      border: 1px solid var(--panel-line);
      color: var(--stone);
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }

    @media (prefers-reduced-motion: no-preference) {
      .tabbar-enter {
        animation: tabbar-in 400ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes tabbar-in {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="overflow-hidden">

  <!-- Map Container -->
  <div id="map" class="absolute inset-0 z-0"></div>

  <!-- Top UI Overlay: small title + slim tab bar -->
  <div class="absolute top-3 left-3 right-3 z-[1000] pointer-events-none">
    <p class="title-line">... ¿Donde está el terreno de abuelo?</p>
    <p id="heading-debug" style="font-family:'IBM Plex Mono',monospace; font-size:9px; color:#8C8272; margin:0 0 5px 2px;">brújula: sin iniciar</p>
    <div class="tabbar tabbar-enter pointer-events-auto inline-flex gap-1.5 overflow-x-auto no-scrollbar max-w-full">
      <button onclick="setLayer('fontan')" id="btn-fontan" class="tab">
        <span class="tab-years">1834</span>
      </button>
      <button onclick="setLayer('minutas')" id="btn-minutas" class="tab">
        <span class="tab-years">1910</span>
      </button>
      <button onclick="setLayer('serieB')" id="btn-serieB" class="tab is-active">
        <span class="tab-years">1956</span>
      </button>
      <button onclick="setLayer('pnoa2004')" id="btn-pnoa2004" class="tab">
        <span class="tab-years">2004</span>
      </button>
      <button onclick="setLayer('modern')" id="btn-modern" class="tab">
        <span class="tab-years">Hoy</span>
      </button>
      <button onclick="setLayer('topo')" id="btn-topo" class="tab">
        <span class="tab-years">Topo</span>
      </button>
    </div>

    <!-- Catastro parcel boundary + NGBE placename overlays — independent
         toggles on their own row, each stacks on top of whichever base
         layer above is active. Both are additive overlays, not base
         layers, so they're wired through their own toggle*() functions
         rather than setLayer(). -->
    <div class="overlay-row pointer-events-auto flex gap-1.5">
      <button onclick="toggleCatastro()" id="btn-catastro" class="overlay-toggle">
        <span class="toggle-dot"></span>
        <span class="toggle-label">Catastro</span>
      </button>
      <button onclick="toggleNombres()" id="btn-nombres" class="overlay-toggle">
        <span class="toggle-dot"></span>
        <span class="toggle-label">Nombres</span>
      </button>
    </div>
  </div>

  <!-- Bottom Floating Action Button: GPS Recenter -->
  <button id="recenter-btn" onclick="recenterMap()" class="dial-btn absolute bottom-6 right-6 z-[1000] p-4 rounded-full">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
    </svg>
  </button>

  <script>
    // Initialize Map centered on Madrid (Puerta del Sol)
    const map = L.map('map', {
      zoomControl: false,
      maxZoom: 20
    }).setView([40.416775, -3.703790], 15);

    // --- WMS Historical Layers ---
    const wmsCommonOptions = {
      format: 'image/jpeg',
      transparent: false,
      version: '1.1.1',
      crs: L.CRS.EPSG4326,
      maxZoom: 20,
      attribution: '© Instituto Geográfico Nacional (IGN)',
      keepBuffer: 4,
      updateWhenZooming: false
    };

    const FontanLayer = L.TileLayer.extend({
      getTileUrl: function (coord) {
        const tileSize = this.getTileSize();
        const nwPoint = coord.scaleBy(tileSize);
        const sePoint = nwPoint.add(tileSize);
        const nw = L.Projection.SphericalMercator.project(this._map.unproject(nwPoint, coord.z));
        const se = L.Projection.SphericalMercator.project(this._map.unproject(sePoint, coord.z));
        const bbox = [nw.x, se.y, se.x, nw.y].join(',');
        return 'https://ideg.xunta.gal/servizos/rest/services/MapasBase/Fontan/MapServer/export'
          + `?bbox=${bbox}&bboxSR=3857&imageSR=3857&size=${tileSize.x},${tileSize.y}`
          + '&format=png32&transparent=true&f=image';
      }
    });
    const fontan = new FontanLayer('', {
      minZoom: 5,
      maxZoom: 18,
      attribution: '© Xunta de Galicia (IET) — Carta Xeométrica de Fontán, 1834'
    });

    const minutas = L.tileLayer.wms('https://www.ign.es/wms/primera-edicion-mtn', {
      layers: 'catastrones',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      maxZoom: 20,
      attribution: '© Instituto Geográfico Nacional (IGN) — Minutas MTN50',
      keepBuffer: 4,
      updateWhenZooming: false
    });

    const serieB = L.tileLayer.wms('https://www.ign.es/wms/pnoa-historico', {
      ...wmsCommonOptions,
      layers: 'AMS_1956-1957'
    });

    const pnoa2004 = L.tileLayer.wms('https://www.ign.es/wms/pnoa-historico', {
      ...wmsCommonOptions,
      layers: 'PNOA2008,PNOA2007,PNOA2006,PNOA2005,PNOA2004'
    });

    const modern = L.tileLayer.wms('https://www.ign.es/wms-inspire/pnoa-ma', {
      layers: 'OI.OrthoimageCoverage',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      maxZoom: 20,
      attribution: '© Instituto Geográfico Nacional (IGN) — PNOA',
      keepBuffer: 4,
      updateWhenZooming: false
    });

    const topo = L.tileLayer.wms('https://www.ign.es/wms-inspire/ign-base', {
      layers: 'IGNBaseTodo',
      format: 'image/png',
      transparent: false,
      version: '1.3.0',
      maxZoom: 20,
      attribution: '© Instituto Geográfico Nacional (IGN) — IGNBaseTodo',
      keepBuffer: 4,
      updateWhenZooming: false
    });

    const catastro = L.tileLayer.wms('https://ovc.catastro.meh.es/cartografia/INSPIRE/spadgcwms.aspx', {
      layers: 'CP.CadastralParcel',
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      maxZoom: 20,
      attribution: '© Dirección General del Catastro'
    });

    const nombres = L.tileLayer.wms('https://www.ign.es/wms-inspire/ngbe', {
      layers: 'GN.GeographicalNames',
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      maxZoom: 20,
      attribution: '© Instituto Geográfico Nacional (IGN) — NGBE'
    });

    function attachTileRetry(layer, maxRetries = 3) {
      const attemptsByTile = new WeakMap();
      layer.on('tileerror', (err) => {
        const tile = err.tile;
        if (!tile) return;
        const attempts = attemptsByTile.get(tile) || 0;
        console.error(`WMS tile failed (attempt ${attempts + 1}):`, tile.src);
        if (attempts >= maxRetries) return;
        attemptsByTile.set(tile, attempts + 1);
        const delay = 700 * (attempts + 1);
        setTimeout(() => {
          const url = new URL(tile.src, window.location.href);
          url.searchParams.set('_retry', Date.now().toString());
          tile.src = url.toString();
        }, delay);
      });
    }

    [fontan, minutas, serieB, pnoa2004, modern, topo, catastro, nombres].forEach(layer => attachTileRetry(layer));

    const layers = { fontan, minutas, serieB, pnoa2004, modern, topo };
    let activeLayer = 'serieB';

    serieB.addTo(map);

    function setLayer(layerKey) {
      if (layerKey === activeLayer) {
        layers[layerKey].redraw();
        return;
      }

      map.removeLayer(layers[activeLayer]);
      layers[layerKey].addTo(map);

      const keys = Object.keys(layers);
      keys.forEach(k => {
        const btn = document.getElementById(`btn-${k}`);
        btn.classList.toggle('is-active', k === layerKey);
      });

      activeLayer = layerKey;

      if (catastroVisible) {
        catastro.bringToFront();
      }
      if (nombresVisible) {
        nombres.bringToFront();
      }
    }

    let catastroVisible = false;
    function toggleCatastro() {
      catastroVisible = !catastroVisible;
      const btn = document.getElementById('btn-catastro');

      if (catastroVisible) {
        catastro.addTo(map);
        catastro.bringToFront();
        if (nombresVisible) nombres.bringToFront();
        btn.classList.add('is-on');
      } else {
        map.removeLayer(catastro);
        btn.classList.remove('is-on');
      }
    }

    let nombresVisible = false;
    function toggleNombres() {
      nombresVisible = !nombresVisible;
      const btn = document.getElementById('btn-nombres');

      if (nombresVisible) {
        nombres.addTo(map);
        nombres.bringToFront();
        btn.classList.add('is-on');
      } else {
        map.removeLayer(nombres);
        btn.classList.remove('is-on');
      }
    }

    // --- Geolocation Tracking ---
    let userMarker = null;
    let accuracyCircle = null;
    let autoCenter = true;

    let programmaticMove = false;

    // The heading cone is a separate absolutely-positioned element sitting
    // BEHIND the dot (first in DOM order = lowest z), 0deg = pointing due
    // north/"up". It starts hidden (opacity 0) because until a real
    // compass or GPS-course reading comes in we don't know which way the
    // person is actually facing — showing a cone pointed at a stale/
    // default heading would be worse than showing no cone at all. Once a
    // reading arrives, updateHeadingDisplay() fades it in and rotates it
    // via a plain CSS transform, so we're not re-creating the divIcon
    // (and losing the ping animation) on every orientation event.
    const gpsIcon = L.divIcon({
      className: 'relative flex items-center justify-center',
      html: `
        <div id="gps-heading-cone" style="position:absolute; width:44px; height:44px; left:50%; top:50%; margin-left:-22px; margin-top:-22px; opacity:0; transition:opacity 250ms ease; transform-origin:50% 50%; pointer-events:none;">
          <svg viewBox="0 0 44 44" width="44" height="44">
            <path d="M22 1 L32 24 Q22 18 12 24 Z" fill="#D9A857" opacity="0.85"/>
          </svg>
        </div>
        <span class="absolute inline-flex h-6 w-6 rounded-full opacity-70" style="background:#C89B4A; animation: ping 1.6s cubic-bezier(0,0,0.2,1) infinite;"></span>
        <span class="relative inline-flex rounded-full h-4 w-4 border-2" style="background:#D9A857; border-color:#14110F;"></span>
      `,
      iconSize: [24, 34],
      iconAnchor: [12, 12]
    });

    // Two independent heading sources feed this, and either can drive it:
    // the device compass (accurate standing still, useless in a moving
    // vehicle without a magnetometer fix) and GPS course-over-ground from
    // coords.heading (accurate while moving, meaningless standing still —
    // it's just noise). We don't try to arbitrate between them; whichever
    // fires most recently wins, which in practice tracks which one is
    // actually meaningful at that moment.
    function normalizeHeading(h) {
      return ((h % 360) + 360) % 360;
    }

    function updateHeadingDisplay(heading) {
      if (heading == null || isNaN(heading) || !userMarker) return;
      const el = userMarker.getElement();
      if (!el) return;
      const cone = el.querySelector('#gps-heading-cone');
      if (!cone) return;
      cone.style.opacity = '1';
      cone.style.transform = `rotate(${normalizeHeading(heading)}deg)`;
      const dbg = document.getElementById('heading-debug');
      if (dbg) dbg.textContent = `rumbo: ${Math.round(normalizeHeading(heading))}°`;
    }

    function onLocationFound(e) {
      const radius = e.accuracy;

      if (!userMarker) {
        userMarker = L.marker(e.latlng, { icon: gpsIcon }).addTo(map);
        accuracyCircle = L.circle(e.latlng, radius, {
          color: '#B8863B',
          fillColor: '#B8863B',
          fillOpacity: 0.12,
          weight: 1
        }).addTo(map);
      } else {
        userMarker.setLatLng(e.latlng);
        accuracyCircle.setLatLng(e.latlng).setRadius(radius);
      }

      if (autoCenter) {
        programmaticMove = true;
        map.setView(e.latlng, map.getZoom());
      }

      // e.heading/e.speed come straight through from the browser's
      // Geolocation API (Leaflet just forwards coords.heading/coords.speed
      // on the locationfound event). heading is only meaningful once
      // there's real motion — standing still it's null or garbage — so we
      // gate on a small speed threshold (~0.5 m/s, filters out GPS jitter
      // while stationary) rather than trusting any non-null value.
      if (typeof e.heading === 'number' && !isNaN(e.heading) && e.speed > 0.5) {
        updateHeadingDisplay(e.heading);
      } else {
        const dbg = document.getElementById('heading-debug');
        if (dbg && !compassEnabled) {
          dbg.textContent = `GPS: heading=${e.heading} speed=${e.speed} (toca el botón de centrar para activar brújula)`;
        }
      }
    }

    function onLocationError(e) {
      alert("Error finding your location: " + e.message);
    }

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);

    map.locate({
      watch: true,
      enableHighAccuracy: true
    });

    map.on('movestart', () => {
      if (programmaticMove) return;
      autoCenter = false;
      document.getElementById('recenter-btn').classList.add('is-idle');
    });

    map.on('moveend', () => {
      programmaticMove = false;
    });

    function recenterMap() {
      autoCenter = true;
      document.getElementById('recenter-btn').classList.remove('is-idle');

      if (userMarker) {
        programmaticMove = true;
        map.setView(userMarker.getLatLng(), 17);
      }

      // Piggybacks the compass permission request on this tap because
      // iOS 13+ only grants DeviceOrientationEvent access from inside a
      // real user gesture handler — asking on page load silently does
      // nothing there. The recenter button is the first tap most people
      // make, and it's a natural fit ("orient me") even though its main
      // job is centering the map.
      enableCompass();
    }

    // --- Compass heading (device orientation) ---
    let compassEnabled = false;

    function handleDeviceOrientation(e) {
      let heading = null;

      if (typeof e.webkitCompassHeading === 'number') {
        // iOS Safari: gives true compass heading directly, 0 = north,
        // clockwise — no conversion needed.
        heading = e.webkitCompassHeading;
      } else if (e.alpha != null) {
        // Android / spec-compliant browsers: alpha is rotation around the
        // z-axis increasing counter-clockwise from the device's initial
        // orientation, so it has to be flipped (360 - alpha) to read as a
        // clockwise-from-north compass heading. Using
        // 'deviceorientationabsolute' (registered below when available)
        // means alpha is anchored to true/magnetic north rather than
        // wherever the page happened to load facing.
        heading = 360 - e.alpha;
      }

      if (heading != null) {
        updateHeadingDisplay(heading);
      }
    }

    function enableCompass() {
      if (compassEnabled) return;
      const dbg = document.getElementById('heading-debug');

      const attach = () => {
        compassEnabled = true;
        if (dbg) dbg.textContent = 'brújula: activa, esperando lectura...';
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleDeviceOrientation);
        } else {
          window.addEventListener('deviceorientation', handleDeviceOrientation);
        }
        // If no orientation event ever fires (common on desktops/laptops
        // with no magnetometer, even though the API exists), let the
        // person know instead of leaving "esperando lectura..." up
        // forever with no explanation.
        setTimeout(() => {
          if (dbg && dbg.textContent === 'brújula: activa, esperando lectura...') {
            dbg.textContent = 'brújula: sin datos del sensor (¿estás en un móvil?)';
          }
        }, 4000);
      };

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        if (dbg) dbg.textContent = 'brújula: pidiendo permiso...';
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              attach();
            } else if (dbg) {
              dbg.textContent = `brújula: permiso denegado (${response}) — revisa Ajustes > Safari > Movimiento y orientación`;
            }
          })
          .catch(err => {
            console.error('Compass permission error:', err);
            if (dbg) dbg.textContent = `brújula: error de permiso — ${err.message}`;
          });
      } else if (typeof DeviceOrientationEvent === 'undefined') {
        if (dbg) dbg.textContent = 'brújula: no soportada en este navegador';
      } else {
        attach();
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
